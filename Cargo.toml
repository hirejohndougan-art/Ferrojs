[workspace]
resolver = "2"
members = ["crates/ferrojs-value", "crates/ferrojs-core", "crates/ferrojs-test262", "crates/ferrojs-diff"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.lints.rust]
# Every crate except ferrojs-core forbids unsafe code (see docs/DECISIONS.md, D-004).
unsafe_code = "forbid"

[profile.release]
debug = 1
