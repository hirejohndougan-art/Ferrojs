[package]
name = "ferrojs-core"
description = "The engine's small, audited unsafe core: heap cage, GC internals, JIT memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# ferrojs-core is the ONLY crate allowed to use `unsafe` (docs/DECISIONS.md, D-004).
# It does not inherit the workspace lint that forbids unsafe code.
[lints.rust]
unsafe_code = "warn"

# Platform memory backends for the cage (D-027).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }
