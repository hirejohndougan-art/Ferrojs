[package]
name = "ferrojs-bench"
description = "Instruction-count benchmarks (Valgrind via gungraun) and the regression check"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.97" # oxc 0.158 needs it (D-032)
publish = false

[dependencies]
ferrojs-bytecode = { path = "../ferrojs-bytecode" }
ferrojs-compiler = { path = "../ferrojs-compiler" }
ferrojs-core = { path = "../ferrojs-core" }
ferrojs-value = { path = "../ferrojs-value" }
ferrojs-vm = { path = "../ferrojs-vm" }
serde_json = "1"

# Valgrind benchmarks run on Linux only; elsewhere the bench is an empty stub
# so `cargo clippy --all-targets` still works on macOS and Windows CI.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "=0.20.0"

# Only benches/ are benchmarks; keeps `cargo bench` from running unit tests.
[lib]
bench = false

[[bin]]
name = "benchcheck"
bench = false

[[bench]]
name = "value"
harness = false

[[bench]]
name = "bytecode"
harness = false

[[bench]]
name = "heap"
harness = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "objects"
harness = false

[[bench]]
name = "interp"
harness = false

[lints]
workspace = true
