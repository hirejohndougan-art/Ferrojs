[package]
name = "ferrojs-test262"
description = "Test262 conformance runner for FerroJS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.97" # oxc 0.158 needs it (D-032)
publish = false
default-run = "test262"

[[bin]]
name = "test262"
path = "src/main.rs"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

[dependencies]
ferrojs-bench = { path = "../ferrojs-bench" }
ferrojs-compiler = { path = "../ferrojs-compiler" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
yaml-rust2 = "0.13"

[lints]
workspace = true
