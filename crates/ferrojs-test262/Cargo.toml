[package]
name = "ferrojs-test262"
description = "Test262 conformance runner for FerroJS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "test262"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
yaml-rust2 = "0.13"

[lints]
workspace = true
