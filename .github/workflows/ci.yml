# Every change: build, lint, unit tests on three platforms, then the Test262
# conformance gate. Nothing merges on failure.
# Later sessions add: differential checks, instruction-count benchmarks,
# Miri on ferrojs-core, and nightly/continuous jobs.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  test262:
    # Runs the pinned Test262 suite against FerroJS. Fails if any test listed
    # in conformance/test262-baseline.txt no longer passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - id: pin
        run: echo "commit=$(cat tools/test262-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: test262
          key: test262-${{ steps.pin.outputs.commit }}
      - run: tools/fetch-test262.sh
      - run: cargo build --release -p ferrojs-test262
      - name: Run Test262
        run: |
          ./target/release/test262 --suite test262 --engine ferrojs \
            --baseline conformance/test262-baseline.txt \
            --out test262-report.json | tee test262-summary.txt
      - name: Publish summary
        if: always()
        run: |
          { echo '```'; cat test262-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test262-report
          path: test262-report.json
