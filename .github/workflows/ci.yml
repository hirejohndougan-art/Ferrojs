# Every change: build, lint, unit tests on three platforms, then the Test262
# conformance gate. Nothing merges on failure.
# Later sessions add:, and nightly/continuous jobs.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  differential:
    # Runs tests/diff/ on FerroJS and on Node.js and fails on any difference
    # (decision D-013). The node-vs-node run checks the harness and corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: node --version
      - run: cargo build --release -p ferrojs-diff
      - run: ./target/release/jsdiff --engine node tests/diff
      - run: ./target/release/jsdiff --engine ferrojs tests/diff

  fuzz:
    # Lints fuzz/ and runs every libFuzzer target briefly (decision D-014).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: tools/fuzz.sh smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  bench:
    # Instruction-count benchmarks; fails on a slowdown over 3% (D-015).
    # CI's rustc may differ from the stored baseline's, in which case
    # tools/bench.sh measures origin/main on this runner and compares to that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Install gungraun-runner
        run: |
          v="$(sed -n '/^name = "gungraun"$/{n;s/^version = "\(.*\)"$/\1/p}' Cargo.lock)"
          cargo install gungraun-runner --version "$v" --locked
      - run: tools/bench.sh check

  miri:
    # ferrojs-core's tests under Miri with strict provenance (D-016).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: tools/miri.sh
        env:
          FERROJS_MIRI_REQUIRED: "1"

  test262:
    # Runs the pinned Test262 suite against FerroJS. Fails if any test listed
    # in conformance/test262-baseline.txt no longer passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - id: pin
        run: echo "commit=$(cat tools/test262-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: test262
          key: test262-${{ steps.pin.outputs.commit }}
      - run: tools/fetch-test262.sh
      - run: cargo build --release -p ferrojs-test262
      - name: Run Test262
        run: |
          ./target/release/test262 --suite test262 --engine ferrojs \
            --baseline conformance/test262-baseline.txt \
            --out test262-report.json | tee test262-summary.txt
      - name: Publish summary
        if: always()
        run: |
          { echo '```'; cat test262-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test262-report
          path: test262-report.json
