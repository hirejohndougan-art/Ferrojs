# cargo-deny: dependency checks in the gate (decision D-026).
# Run with `tools/deny.sh`.

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and on unmaintained or yanked crates.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Only licenses compatible with shipping FerroJS under MIT (see docs/PLAN.md,
# Licensing). Adding a license here needs a decision entry.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates only from crates.io; no git or other registries without a decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
